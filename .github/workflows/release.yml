name: Public release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Check release identity
        id: release
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/release-identity.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:package
      - name: Pack verified package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const heading = `## ${process.env.RELEASE_VERSION}\n`;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          assert(changelog.includes(heading), 'Release requires a changelog entry');
          const notes = changelog.split(heading)[1].split('\n## ')[0].trim();
          assert(notes.length > 0, 'Release notes must not be empty');
          writeFileSync('artifacts/release-notes.md', notes);
          NODE
          npm pack --ignore-scripts --pack-destination artifacts
          cd artifacts
          sha256sum ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.20.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-package
          path: artifacts
      - name: Publish with npm trusted publishing
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS
          npm publish ./*.tgz --access public --tag "$DIST_TAG" --provenance --ignore-scripts --registry https://registry.npmjs.org/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.tgz artifacts/SHA256SUMS --verify-tag --prerelease="$PRERELEASE" --title "$RELEASE_TAG" --notes-file artifacts/release-notes.md
